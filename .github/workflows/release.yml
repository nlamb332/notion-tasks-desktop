name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and package version
        run: npm run validate:release -- ${{ github.ref_name }}

      - name: Run checks
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version.Contains('-')) {
            npx electron-builder --config electron-builder.preview.json --win nsis --x64 --publish never
          } else {
            npx electron-builder --win nsis --x64 --publish never
          }

      - name: Publish complete GitHub release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $isPreview = $version.Contains('-')
          $tag = $env:GITHUB_REF_NAME
          $folder = if ($isPreview) { "release-preview/$version" } else { "release/$version" }
          $product = if ($isPreview) { 'Notion-Tasks-Preview' } else { 'Notion-Tasks' }
          $title = if ($isPreview) { "Notion Tasks Preview $version" } else { "Notion Tasks $version" }
          $assets = @(
            "$folder/$product-Setup-$version.exe",
            "$folder/$product-Setup-$version.exe.blockmap",
            "$folder/latest.yml"
          )
          foreach ($asset in $assets) {
            if (!(Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing release asset: $asset" }
          }
          # Create one draft with all files, avoiding concurrent publisher records.
          $arguments = @('release', 'create', $tag, '--verify-tag', '--draft', '--title', $title, '--generate-notes')
          if ($isPreview) { $arguments += '--prerelease' }
          $arguments += $assets
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Could not create and upload the release draft' }
          $json = gh release view $tag --json assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded release assets' }
          $uploaded = ($json | ConvertFrom-Json).assets
          foreach ($asset in $assets) {
            $name = Split-Path -Leaf $asset
            if (!($uploaded | Where-Object { $_.name -eq $name -and $_.state -eq 'uploaded' -and $_.size -gt 0 })) {
              throw "Release asset was not uploaded: $name"
            }
          }
          $latest = if ($isPreview) { 'false' } else { 'true' }
          gh release edit $tag --draft=false "--latest=$latest"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified release draft' }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
