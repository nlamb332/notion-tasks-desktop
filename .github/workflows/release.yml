name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag and package version
        run: npm run validate:release -- ${{ github.ref_name }}

      - name: Run checks
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Build and publish Windows installer
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version.Contains('-')) {
            npx electron-builder --config electron-builder.preview.json --win nsis --x64 --publish always
          } else {
            npx electron-builder --win nsis --x64 --publish always
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
